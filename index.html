<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FreshCheck - Visionaries</title>
<style>
:root{
  --bg:#04070f; --bg2:#0a1124; --text:#eaf0ff; --muted:#93a0c4; --card:rgba(255,255,255,.05); --border:rgba(120,160,255,.18);
  --a:#2f7bff; --a2:#00b4ff; --good:#22c55e; --bad:#ef4444; --warn:#f59e0b; --nav:rgba(4,7,15,.8); --glow:0 10px 40px rgba(47,123,255,.28);
}
[data-theme=light]{
  --bg:#f4f7ff; --bg2:#ffffff; --text:#0a1530; --muted:#55628a; --card:rgba(255,255,255,.9); --border:rgba(20,50,120,.16);
  --a:#1a5cff; --a2:#0a8bd6; --good:#0f9d58; --bad:#d93025; --warn:#b26a00; --nav:rgba(255,255,255,.85); --glow:0 10px 30px rgba(26,92,255,.15);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:78px}
body{margin:0;font-family:system-ui,"Segoe UI",Roboto,"Noto Sans Devanagari",sans-serif;background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden;transition:background .4s,color .4s}
.bg{position:fixed;inset:0;z-index:-1;overflow:hidden;background:radial-gradient(circle at 15% 0%,var(--bg2),var(--bg) 60%)}
.orb{position:absolute;border-radius:50%;filter:blur(110px);opacity:.35;animation:float 18s ease-in-out infinite}
.o1{width:460px;height:460px;background:var(--a);left:-140px;top:-100px}
.o2{width:380px;height:380px;background:var(--a2);right:-120px;top:30%;animation-delay:-7s}
[data-theme=light] .orb{opacity:.16}
@keyframes float{50%{transform:translate(40px,-40px) scale(1.12)}}
.grid{position:absolute;inset:0;background-image:linear-gradient(var(--border) 1px,transparent 1px),linear-gradient(90deg,var(--border) 1px,transparent 1px);background-size:56px 56px;opacity:.28;mask-image:radial-gradient(circle at 50% 15%,#000,transparent 70%)}
/* nav */
nav{position:sticky;top:0;z-index:50;backdrop-filter:blur(16px);background:var(--nav);border-bottom:1px solid var(--border)}
.navin{max-width:1180px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:9px 18px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--text)}
.brand img{height:44px;border-radius:9px;background:#000}
.lf{display:none;font-weight:900;letter-spacing:2px;padding:7px 11px;border-radius:9px;background:var(--a);color:#fff;font-size:13px}
.brand b{font-size:19px;letter-spacing:.3px}
.links{display:flex;gap:2px}
.links a{color:var(--text);text-decoration:none;padding:8px 12px;border-radius:10px;font-weight:600;font-size:14px;white-space:nowrap;transition:background .2s}
.links a:hover{background:var(--card)}
.right{display:flex;align-items:center;gap:8px;position:relative}
.icon{background:var(--card);border:1px solid var(--border);color:var(--text);width:40px;height:40px;border-radius:50%;font-size:17px;cursor:pointer;transition:transform .2s}
.icon:hover{transform:scale(1.1)}
#gear:hover{transform:rotate(60deg) scale(1.1)}
.menu{display:none;position:absolute;top:50px;right:0;width:290px;padding:16px;border-radius:18px;background:var(--bg2);border:1px solid var(--border);box-shadow:0 20px 60px rgba(0,0,0,.35)}
.menu.open{display:block;animation:pop .25s both}
.menu h5{margin:12px 0 8px;font-size:12px;letter-spacing:1px;text-transform:uppercase;color:var(--muted)}
.menu h5:first-child{margin-top:0}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{flex:1;background:var(--card);color:var(--text);border:1px solid var(--border);padding:8px 10px;border-radius:10px;cursor:pointer;font-weight:600;font-size:13px}
.seg button.on{background:var(--a);color:#fff;border-color:transparent}
@media(max-width:1120px){.links{display:none}}@media(max-width:520px){.brand b{display:none}}
main{max-width:1180px;margin:0 auto;padding:0 18px}
section{padding:56px 0}
.sec-t{text-align:center;font-size:clamp(26px,4vw,40px);margin:0 0 8px}
.sec-s{text-align:center;color:var(--muted);margin:0 auto 30px;max-width:640px}
.grad{background:linear-gradient(90deg,var(--a2),var(--a));-webkit-background-clip:text;background-clip:text;color:transparent}
.muted{color:var(--muted)}
/* hero */
.hero{display:grid;grid-template-columns:1.1fr .9fr;gap:40px;align-items:center;padding:64px 0 30px}
.hero h1{font-size:clamp(34px,5.4vw,62px);margin:0 0 16px;line-height:1.08}
.hero p{color:var(--muted);font-size:18px;line-height:1.55;margin:0 0 24px}
.cta{display:flex;gap:12px;flex-wrap:wrap}
.btn{border:0;color:#fff;padding:12px 22px;border-radius:12px;font-size:15px;font-weight:700;cursor:pointer;background:linear-gradient(135deg,var(--a),var(--a2));box-shadow:var(--glow);transition:transform .15s,filter .2s;text-decoration:none;display:inline-block}
.btn:hover{transform:translateY(-2px);filter:brightness(1.12)}
.btn:active{transform:scale(.96)}
.btn.ghost{background:var(--card);color:var(--text);border:1px solid var(--border);box-shadow:none}
.btn.sm{padding:8px 14px;font-size:13px;border-radius:10px}
.btn:disabled{opacity:.5;pointer-events:none}
.pills{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px}
.pillb{padding:6px 14px;border-radius:999px;border:1px solid var(--border);background:var(--card);font-size:13px}
.mock{padding:22px;border-radius:22px;background:var(--card);border:1px solid var(--border);backdrop-filter:blur(14px);box-shadow:var(--glow);animation:bob 5s ease-in-out infinite;position:relative}
@keyframes bob{50%{transform:translateY(-10px)}}
.mock .dots{display:flex;gap:6px;margin-bottom:14px}.mock .dots i{width:11px;height:11px;border-radius:50%;display:block}
.mock p{margin:0 0 14px;font-size:16px;line-height:1.7;color:var(--text)}
/* panels */
.panel{background:var(--card);border:1px solid var(--border);border-radius:20px;padding:20px;backdrop-filter:blur(12px);box-shadow:var(--glow)}
textarea{width:100%;min-height:110px;resize:vertical;background:transparent;color:var(--text);border:1px solid var(--border);border-radius:14px;padding:14px;font-size:16px;font-family:inherit;outline:none;transition:border .2s,box-shadow .2s}
textarea:focus,input[type=text]:focus{border-color:var(--a);box-shadow:0 0 0 3px rgba(47,123,255,.22)}
input[type=text]{width:100%;background:transparent;color:var(--text);border:1px solid var(--border);border-radius:14px;padding:13px;font-size:16px;font-family:inherit;outline:none}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px;align-items:center}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px;align-items:center}
.chip{padding:7px 13px;border-radius:999px;border:1px dashed var(--a);color:var(--text);background:transparent;cursor:pointer;font-size:13px;transition:all .2s}
.chip:hover{background:var(--a);color:#fff;transform:translateY(-2px)}
.rec{animation:pulse 1s infinite;background:linear-gradient(135deg,#ef4444,#f97316)!important;color:#fff!important}
@keyframes pulse{50%{box-shadow:0 0 0 12px rgba(239,68,68,0)}}
.loader{display:none;text-align:center;padding:30px;margin-top:18px}
.spin{width:60px;height:60px;margin:0 auto 14px;border-radius:50%;border:6px solid var(--border);border-top-color:var(--a);animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
#results{margin-top:22px}
.banner{padding:10px 16px;border-radius:12px;background:var(--a);color:#fff;font-weight:700;margin-bottom:14px}
.summary{display:flex;gap:22px;align-items:center;flex-wrap:wrap}
.gauge{position:relative;width:140px;height:140px;flex:none}
.gauge svg,.mini svg{transform:rotate(-90deg)}
.gauge .val{position:absolute;inset:0;display:grid;place-items:center;font-size:32px;font-weight:900}
.sumtxt{flex:1;min-width:260px}.sumtxt h2{margin:0 0 6px}
.stats{display:flex;gap:10px;flex-wrap:wrap;margin:10px 0}
.stat{padding:7px 13px;border-radius:12px;font-weight:700;border:1px solid var(--border);background:var(--card);font-size:14px}
.badge{display:inline-block;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:700;background:var(--a);color:#fff;margin-left:6px}
.ansbox{margin-top:16px;padding:16px;border-radius:14px;border:1px solid var(--border);background:var(--card);white-space:pre-wrap;line-height:1.9}
.ansbox h4{margin:0 0 8px;white-space:normal}
.legend{font-size:13px;color:var(--muted);margin-top:10px;white-space:normal}
mark.hl{padding:2px 5px;border-radius:6px;cursor:pointer;color:inherit;border-bottom:2px solid var(--c);background:color-mix(in srgb,var(--c) 22%,transparent);transition:background .2s}
mark.hl:hover{background:color-mix(in srgb,var(--c) 42%,transparent)}
mark.hl.stale{--c:var(--bad)}mark.hl.fresh{--c:var(--good)}mark.hl.unclear{--c:var(--warn)}
mark.fx{background:color-mix(in srgb,var(--a) 28%,transparent);border-bottom:2px solid var(--a);padding:2px 4px;border-radius:5px;color:inherit;font-weight:700}
.fixbox{margin-top:16px;padding:16px;border-radius:14px;border:1px solid var(--a);background:color-mix(in srgb,var(--a) 8%,transparent);white-space:pre-wrap;line-height:1.8}
.fixbox h4{margin:0 0 8px;white-space:normal}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(310px,1fr));gap:16px;margin-top:18px}
.cc{padding:18px;border-radius:18px;background:var(--card);border:1px solid var(--border);border-left:6px solid var(--c);animation:pop .5s both;transition:transform .2s,box-shadow .3s;position:relative}
.cc:hover{transform:translateY(-4px)}
.cc.flash{box-shadow:0 0 0 3px var(--c)}
@keyframes pop{from{opacity:0;transform:translateY(16px) scale(.96)}}
.cc .top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.tag{padding:4px 12px;border-radius:999px;font-size:12px;font-weight:800;color:#fff;background:var(--c)}
.mini{width:52px;height:52px;position:relative;flex:none}
.mini span{position:absolute;inset:0;display:grid;place-items:center;font-size:13px;font-weight:800}
.cc h4{margin:12px 0 8px;font-size:16px}
.lbl{font-size:12px;color:var(--muted);margin-top:10px;text-transform:uppercase;letter-spacing:.5px}
.ev{margin:6px 0 0;padding:8px 12px;border-left:3px solid var(--a);background:color-mix(in srgb,var(--a) 8%,transparent);font-size:13px;font-style:italic;border-radius:0 8px 8px 0}
.ev-ok{font-size:12px;color:var(--good);font-weight:700;font-style:normal;margin-top:4px}
.ev-no{font-size:12px;color:var(--warn);margin-top:8px}
.sb{display:inline-block;padding:2px 9px;border-radius:6px;font-size:11px;font-weight:800;margin-right:6px;color:#fff}
.sb-official{background:#475569}.sb-reference{background:#7c3aed}.sb-news{background:#0284c7}.sb-blog{background:#6b7280}
.warnc{display:inline-block;margin-top:8px;padding:3px 10px;border-radius:8px;background:color-mix(in srgb,var(--warn) 22%,transparent);color:var(--warn);font-size:12px;font-weight:700}
.cc a{color:var(--a2);font-weight:700;text-decoration:none}
.stamp{display:inline-block;margin-top:12px;padding:4px 12px;border:3px solid var(--c);color:var(--c);font-weight:900;letter-spacing:1.5px;border-radius:8px;transform:rotate(-6deg);font-size:13px;text-transform:uppercase;animation:slam .5s cubic-bezier(.2,1.6,.4,1) both;animation-delay:var(--d,.5s)}
@keyframes slam{0%{opacity:0;transform:rotate(-14deg) scale(3.2)}100%{opacity:1;transform:rotate(-6deg) scale(1)}}
.tmb{margin-top:12px}
.tmbox{margin-top:10px;display:none}
.tmbox.open{display:block}
.tmtrack{display:flex;justify-content:space-between;gap:4px;margin:6px 0}
.tmtrack .dot{text-align:center;font-size:11px;color:var(--muted);flex:1;cursor:pointer}
.tmtrack .dot i{display:block;width:12px;height:12px;border-radius:50%;margin:0 auto 4px;background:var(--border);transition:background .3s,transform .3s}
.tmtrack .dot.on i{background:var(--a);transform:scale(1.25)}
.tmr{width:100%;accent-color:var(--a)}
.tmview{margin-top:8px;padding:10px 12px;border-radius:10px;background:color-mix(in srgb,var(--a) 8%,transparent);font-size:14px}
/* gateway panel */
.gw{margin-top:18px}
.gw h3{margin:0 0 2px}
.kv{display:flex;gap:10px;flex-wrap:wrap;margin:12px 0}
.kv div{padding:8px 14px;border-radius:12px;border:1px solid var(--border);background:var(--card);font-size:13px}
.kv b{display:block;font-size:16px;color:var(--a2)}
.st{display:grid;grid-template-columns:minmax(120px,1.1fr) 2fr 1.6fr 60px;gap:10px;align-items:center;padding:7px 0;border-bottom:1px solid var(--border);font-size:13px}
.st .sd{color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.st .bar{height:8px;border-radius:6px;background:var(--border);overflow:hidden}.st .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--a),var(--a2))}
.st .ms{text-align:right;color:var(--muted)}
@media(max-width:700px){.st{grid-template-columns:1fr 60px}.st .sd,.st .bar{display:none}}
/* history */
.hist{margin-top:22px}
.hist .h{padding:10px 14px;border:1px solid var(--border);border-radius:12px;margin-top:8px;cursor:pointer;background:var(--card);display:flex;justify-content:space-between;gap:10px}
.hist .h:hover{border-color:var(--a)}
/* compare */
.cmpgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px;margin-top:18px}
.mc{padding:18px;border-radius:18px;background:var(--card);border:1px solid var(--border);animation:pop .5s both}
.mc.best{border-color:var(--good);box-shadow:0 0 0 2px color-mix(in srgb,var(--good) 40%,transparent)}
.mc h4{margin:0;font-size:15px;word-break:break-all}
.mc .ans{font-size:13px;color:var(--muted);margin:10px 0;line-height:1.5;max-height:110px;overflow:auto}
.mc .sl{font-size:13px;margin-top:6px;color:var(--bad)}
.crown{padding:12px 16px;border-radius:12px;background:color-mix(in srgb,var(--a) 12%,transparent);color:var(--a);font-weight:700;margin-top:16px}
/* dashboard */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:16px}
.kpi{padding:16px;border-radius:16px;border:1px solid var(--border);background:var(--card);text-align:center}
.kpi b{display:block;font-size:28px;color:var(--a2)}
.brow{display:grid;grid-template-columns:110px 1fr 70px;gap:12px;align-items:center;margin:12px 0;font-size:14px}
.stack{display:flex;height:16px;border-radius:8px;overflow:hidden;background:var(--border)}
.stack i{display:block;height:100%;transition:width 1s}
/* health pill */
.health{display:inline-flex;align-items:center;gap:7px;padding:6px 12px;border-radius:999px;border:1px solid var(--border);background:var(--card);font-size:12px;font-weight:700;white-space:nowrap;cursor:default}
.health i{width:9px;height:9px;border-radius:50%;background:var(--muted);display:block}
.health.ok i{background:var(--good);box-shadow:0 0 8px var(--good)}
.health.down{border-color:var(--bad);color:var(--bad)}
.health.down i{background:var(--bad);animation:pulse2 1s infinite}
.health.warn i{background:var(--warn)}
@keyframes pulse2{50%{opacity:.3}}
@media(max-width:700px){.health b{display:none}}
/* score breakdown */
.sp{margin-top:10px;font-size:13px}
.sp summary{cursor:pointer;color:var(--a2);font-weight:700}
.sp .spr{display:flex;justify-content:space-between;gap:10px;padding:4px 0;border-bottom:1px dashed var(--border)}
.sp .pos{color:var(--good);font-weight:800}.sp .neg{color:var(--bad);font-weight:800}
.sp .spt{display:flex;justify-content:space-between;padding-top:6px;font-weight:800}
/* api block */
.codeblock{position:relative;margin-top:14px;padding:16px;border-radius:14px;background:#050a18;color:#cfe0ff;border:1px solid var(--border);font-family:Consolas,Menlo,monospace;font-size:13px;line-height:1.6;white-space:pre;overflow:auto}
.codeblock .cb{position:absolute;top:8px;right:8px}
.apigrid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.apigrid>*{min-width:0}
.codeblock{max-width:100%}
@media(max-width:860px){.apigrid{grid-template-columns:1fr}}
/* steps */
.g4{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:16px}
.step{padding:22px;border-radius:18px;background:var(--card);border:1px solid var(--border);transition:transform .25s,border-color .25s}
.step:hover{transform:translateY(-6px);border-color:var(--a)}
.step .n{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-weight:800;color:#fff;background:linear-gradient(135deg,var(--a),var(--a2));margin-bottom:12px}
.step h3{margin:0 0 6px}.step p{margin:0;color:var(--muted);font-size:14px;line-height:1.5}
footer{border-top:1px solid var(--border);margin-top:30px;padding:34px 18px;text-align:center;color:var(--muted)}
footer img{height:70px;border-radius:12px;background:#000;margin-bottom:10px}
footer .tl{letter-spacing:3px;font-size:13px;margin-top:6px}
canvas#fx{position:fixed;inset:0;pointer-events:none;z-index:90}
@media(max-width:860px){.hero{grid-template-columns:1fr;padding-top:36px}}
/* print / PDF */
@media print{
  html,html[data-theme]{--bg:#fff;--bg2:#fff;--text:#111;--muted:#444;--card:#fff;--border:#bbb}
  body *{visibility:hidden}
  #results,#results *{visibility:visible}
  #results{position:absolute;left:0;top:0;width:100%}
  .noprint{display:none!important}
  .cc,.panel{box-shadow:none;break-inside:avoid}
}
</style>
</head>
<body>
<div class="bg"><div class="orb o1"></div><div class="orb o2"></div><div class="grid"></div></div>
<canvas id="fx"></canvas>

<nav class="noprint"><div class="navin">
  <a class="brand" href="#home">
    <img src="/logo" alt="Visionaries" onerror="this.style.display='none';this.nextElementSibling.style.display='inline-block'">
    <span class="lf">VISIONARIES</span>
    <b>FreshCheck</b>
  </a>
  <div class="links">
    <a href="#home" data-i18n="navHome"></a><a href="#try" data-i18n="navTry"></a><a href="#compare" data-i18n="navCompare"></a><a href="#dashboard" data-i18n="navDash"></a><a href="#api" data-i18n="navApi"></a><a href="#how" data-i18n="navHow"></a>
  </div>
  <div class="right">
    <span class="health" id="health" title=""><i></i><b id="healthTxt">...</b></span>
    <button class="icon" id="soundBtn" title="Sound">🔊</button>
    <button class="icon" id="gear" title="Settings">⚙</button>
    <div class="menu" id="menu">
      <h5 data-i18n="mTheme"></h5>
      <div class="seg"><button id="thDark" data-i18n="dark"></button><button id="thLight" data-i18n="light"></button></div>
      <h5 data-i18n="mLang"></h5>
      <div class="seg" id="langSeg"></div>
      <h5 data-i18n="mSound"></h5>
      <div class="seg"><button id="sndOn" data-i18n="on"></button><button id="sndOff" data-i18n="off"></button></div>
    </div>
  </div>
</div></nav>

<main>
  <section class="hero noprint" id="home">
    <div>
      <h1 class="grad" data-i18n="heroTitle"></h1>
      <p data-i18n="heroSub"></p>
      <div class="cta"><a class="btn" href="#try" data-i18n="ctaTry"></a><a class="btn ghost" href="#how" data-i18n="ctaHow"></a></div>
      <div class="pills"><span class="pillb" data-i18n="b1"></span><span class="pillb" data-i18n="b2"></span><span class="pillb" data-i18n="b3"></span><span class="pillb" data-i18n="b4"></span></div>
    </div>
    <div class="mock">
      <div class="dots"><i style="background:#ff5f57"></i><i style="background:#febc2e"></i><i style="background:#28c840"></i></div>
      <p><mark class="hl stale">Python 3.12 is the latest version</mark> and <mark class="hl fresh">Anthropic's CEO is Dario Amodei</mark>.</p>
      <span class="stamp" style="--c:var(--bad)" data-i18n="expired"></span>
      <span class="stamp" style="--c:var(--good);--d:.9s;margin-left:10px" data-i18n="fresh"></span>
    </div>
  </section>

  <section id="try">
    <div class="noprint">
      <h2 class="sec-t grad" data-i18n="tryTitle"></h2>
      <p class="sec-s" data-i18n="trySub"></p>
      <div class="panel">
        <textarea id="inp" data-i18n-ph="placeholder"></textarea>
        <div class="row">
          <button class="btn" id="bAsk" data-i18n="askBtn"></button>
          <button class="btn" id="bCheck" data-i18n="checkBtn"></button>
          <button class="btn ghost" id="bVoice" data-i18n="voiceBtn"></button>
          <button class="btn ghost" id="bMic" data-i18n="micBtn"></button>
        </div>
        <div class="chips" id="demos"></div>
      </div>
      <div class="loader panel" id="loader"><div class="spin"></div><div id="loadTxt"></div></div>
    </div>
    <div id="results"></div>
    <div class="hist noprint" id="hist"></div>
  </section>

  <section id="compare" class="noprint">
    <h2 class="sec-t grad" data-i18n="cmpTitle"></h2>
    <p class="sec-s" data-i18n="cmpSub"></p>
    <div class="panel">

let ac=null;
function ctx(){if(!ac){try{ac=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(ac&&ac.state==="suspended")ac.resume();return ac}
function tone(f,d,type,vol,delay){
  if(!S.sound)return;const a=ctx();if(!a)return;
  const o=a.createOscillator(),g=a.createGain();o.type=type||"sine";o.frequency.value=f;
  const t=a.currentTime+(delay||0);g.gain.setValueAtTime(vol||.12,t);g.gain.exponentialRampToValueAtTime(.0001,t+(d||.1));
  o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+(d||.1)+.02);
}

  pop(){tone(660,.1,"square",.06);tone(990,.12,"square",.05,.08)},
  good(){[523,659,784,1047].forEach((f,i)=>tone(f,.18,"triangle",.13,i*.09))},
  bad(){[400,320,240].forEach((f,i)=>tone(f,.22,"sawtooth",.08,i*.12))},
  start(){[392,523,659].forEach((f,i)=>tone(f,.14,"sine",.11,i*.07))},
  stamp(){tone(140,.28,"sine",.3);tone(70,.35,"triangle",.25,.02)}
};
function speak(text){
  if(!S.sound||!("speechSynthesis" in window)||!text)return;
  speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang=T().speech;u.rate=.95;
  const v=speechSynthesis.getVoices().find(v=>v.lang&&v.lang.toLowerCase().startsWith(u.lang.slice(0,2).toLowerCase()));if(v)u.voice=v;
  speechSynthesis.speak(u);
}

/* ---------- rendering helpers ---------- */
const colorFor=v=>v==="fresh"?"var(--good)":v==="stale"?"var(--bad)":"var(--warn)";
function ring(score,size,stroke,col){
  score=Number.isFinite(Number(score))?Math.max(0,Math.min(100,Number(score))):0;
  const r=(size-stroke)/2,c=2*Math.PI*r;
  return `<svg width="${size}" height="${size}"><circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="var(--border)" stroke-width="${stroke}"/><circle class="arc" data-c="${c}" data-s="${score}" cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${col}" stroke-width="${stroke}" stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${c}" style="transition:stroke-dashoffset 1.3s ease"/></svg>`;
}
function animateArcs(root,avg,valId){
  requestAnimationFrame(()=>setTimeout(()=>{
    (root||document).querySelectorAll(".arc").forEach(a=>{a.style.strokeDashoffset=a.dataset.c*(1-a.dataset.s/100)});
    const g=valId&&$(valId);if(!g)return;let n=0;const iv=setInterval(()=>{n+=Math.max(1,Math.round(avg/30));if(n>=avg){n=avg;clearInterval(iv)}g.textContent=n},30);
  },60));
}

function hlAnswer(answer,claims){

  let out="",pos=0;
  for(const sp of spans){
    if(sp.s<pos||sp.e>answer.length)continue;
    out+=esc(answer.slice(pos,sp.s))+`<mark class="hl ${esc(sp.v)}" data-i="${sp.i}" title="${esc(claims[sp.i].correct_value)}">${esc(answer.slice(sp.s,sp.e))}</mark>`;
    pos=sp.e;
  }
  return out+esc(answer.slice(pos));
}
function stampText(c){
  const t=T();
  if(c.verdict==="stale")return t.expired;
  if(c.verdict==="fresh")return c.best_before?`${t.bestBefore} ${fmtDate(c.best_before)}`:t.fresh;
  return t.verifyStamp;
}
function reportText(d){
  const t=T(),s=d.summary||{avg:0};
  return `FreshCheck - Visionaries\n${t.overall}: ${s.avg}/100\n\n`+d.claims.map(c=>`[${t[c.verdict]||c.verdict}] ${c.freshness_score}/100 - ${c.claim}\n  ${t.correct}: ${c.correct_value}\n  ${t.evidence}: ${c.evidence_quote||"-"}\n  ${t.source}: ${c.source_url}`).join("\n\n");
}

}

/* ---------- share link ---------- */
function shareLink(d){
  const ans=(d.answer||"").slice(0,1500);
  const o={a:ans,s:d.summary,c:d.claims.map(c=>({c:c.claim,v:c.verdict,f:c.freshness_score,x:c.correct_value,u:c.source_url,e:c.evidence_quote||"",t:c.type,b:c.source_type,r:c.reason,bb:c.best_before,sp:c.span&&c.span[1]<=1500?c.span:null,cf:c.conflict?1:0}))};
  const b64=btoa(unescape(encodeURIComponent(JSON.stringify(o)))).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");
  return location.origin+location.pathname+"#report="+b64;
}
function loadShared(){
  if(!location.hash.startsWith("#report="))return;
  try{
    const encoded=location.hash.slice(8);
    if(encoded.length>30000)return;
    let b=encoded.replace(/-/g,"+").replace(/_/g,"/");while(b.length%4)b+="=";
    const o=JSON.parse(decodeURIComponent(escape(atob(b))));
    if(!o||typeof o!=="object"||!Array.isArray(o.c))return;
    const text=(v,max=4000)=>typeof v==="string"?v.slice(0,max):"";
    const number=(v,max=100)=>{const n=Number(v);return Number.isFinite(n)?Math.max(0,Math.min(max,n)):0};
    const allowedVerdicts=["fresh","stale","unclear"],allowedTypes=["pricing","version","leadership","law","stat","other"];
    const allowedSources=["official","reference","news","blog"],answer=text(o.a,1500);
    const claims=o.c.slice(0,8).filter(c=>c&&typeof c==="object"&&!Array.isArray(c)).map(c=>{
      const verdict=allowedVerdicts.includes(c.v)?c.v:"unclear";
      let span=null;
      if(Array.isArray(c.sp)&&c.sp.length===2){
        const start=Number(c.sp[0]),end=Number(c.sp[1]);
        if(Number.isInteger(start)&&Number.isInteger(end)&&start>=0&&end>start&&end<=answer.length)span=[start,end];
      }
      return {claim:text(c.c,1000),verdict,freshness_score:number(c.f),correct_value:text(c.x,1000),
        source_url:text(c.u,2048),evidence_quote:text(c.e,1000),type:allowedTypes.includes(c.t)?c.t:"other",
        source_type:allowedSources.includes(c.b)?c.b:"blog",reason:text(c.r,2000),
        best_before:/^\d{4}-\d{2}-\d{2}$/.test(c.bb)?c.bb:null,span,conflict:c.cf===1||c.cf===true,
        conflict_note:"",search_query:""};
    }).filter(c=>c.claim.trim());
    const n=claims.length,fresh=claims.filter(c=>c.verdict==="fresh").length,stale=claims.filter(c=>c.verdict==="stale").length;
    const avg=n?Math.round(claims.reduce((sum,c)=>sum+c.freshness_score,0)/n):0;
    S.data={answer,summary:{avg,fresh,stale,unclear:n-fresh-stale,n},cached:false,trace:null,claims};
    S.shared=true;renderResults();setTimeout(()=>$("try").scrollIntoView(),100);
  }catch(e){}
}

/* ---------- run a check ---------- */
let loadIv=null;
function setBusy(b){document.querySelectorAll(".btn").forEach(x=>x.disabled=b)}
function shortAns(a){
  a=(a||"").replace(/\*\*/g,"").replace(/\s+/g," ").trim();if(a.length<=260)return a;
  const cut=a.slice(0,260),k=Math.max(cut.lastIndexOf(". "),cut.lastIndexOf("। "));return k>80?cut.slice(0,k+1):cut;
}
async function go(path,opt){
  opt=opt||{};const t=T(),text=$("inp").value.trim();
  if(!text){speak(t.empty);$("inp").focus();return}
  setBusy(true);S.fixed=null;S.tm={};S.shared=false;S.data=null;
  $("results").innerHTML="";$("loader").style.display="block";sfx.start();
  let i=0;$("loadTxt").textContent=t.loading[0];
  loadIv=setInterval(()=>{i=(i+1)%t.loading.length;$("loadTxt").textContent=T().loading[i]},2500);
  try{
    const r=await fetch(path,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({text})});
    if(!r.ok){let m="";try{m=(await r.json()).detail}catch(e){}throw new Error(m||r.status)}
    S.data=await r.json();renderResults();
    const s=S.data.summary;addHist(text,(S.data.claims||[]).length?s.avg:null);refreshStats();
    if(s.stale>0)sfx.bad();
    document.querySelectorAll('[data-stamp="stale"]').forEach((el,k)=>setTimeout(sfx.stamp,500+k*250));
    if(opt.voice)setTimeout(()=>speak(shortAns(S.data.answer)+" "+(s.stale?T().warn(s.stale):T().allGood)),900);
    else setTimeout(()=>speak(T().say(s.n,s.fresh,s.stale)),900);
    $("results").scrollIntoView({behavior:"smooth"});
  }catch(e){$("results").innerHTML=`<div class="panel">⚠ ${esc(t.err)}<br><small class="muted">${esc(e.message)}</small></div>`;sfx.bad()}
  clearInterval(loadIv);$("loader").style.display="none";setBusy(false);
}

function renderDash(){
  const s=S.stats,t=T(),box=$("dash");

/* ---------- confetti ---------- */
function confetti(){
  const c=$("fx"),x=c.getContext("2d");c.width=innerWidth;c.height=innerHeight;
  const cols=["#2f7bff","#00b4ff","#22c55e","#ffffff","#93c5fd"];
  const p=Array.from({length:130},()=>({x:innerWidth/2,y:innerHeight/2,vx:(Math.random()-.5)*16,vy:Math.random()*-14-3,s:Math.random()*8+4,c:cols[Math.random()*5|0],r:Math.random()*6}));
  let f=0;(function loop(){x.clearRect(0,0,c.width,c.height);p.forEach(q=>{q.x+=q.vx;q.y+=q.vy;q.vy+=.35;q.r+=.2;x.save();x.translate(q.x,q.y);x.rotate(q.r);x.fillStyle=q.c;x.fillRect(-q.s/2,-q.s/2,q.s,q.s*.6);x.restore()});
  if(++f<130)requestAnimationFrame(loop);else x.clearRect(0,0,c.width,c.height)})();
}

/* ---------- gateway health ---------- */
let HEALTH=null;
async function refreshHealth(){
  const el=$("health"),t=T();
  try{
    const r=await fetch("/health");HEALTH=await r.json();
  }catch(e){HEALTH=null}
  if(!HEALTH){el.className="health down";$("healthTxt").textContent=t.hDown;el.title=t.hDownTip;return}
  if(!HEALTH.gateway_ok){el.className="health down";$("healthTxt").textContent=HEALTH.gateway+" · "+t.hDown;el.title=t.hDownTip}
  else if(!HEALTH.tavily_key){el.className="health warn";$("healthTxt").textContent=t.hKey;el.title=t.hKey}
  else{el.className="health ok";$("healthTxt").textContent=HEALTH.gateway+" · "+t.hOk;el.title=HEALTH.gateway_url+" · "+HEALTH.model+" · "+t.hOkTip}
  renderApi();
}
function renderApi(){
  const model=(HEALTH&&HEALTH.model)||"groq/openai/gpt-oss-120b";
  $("apiReqTxt").textContent=`import requests

r = requests.post(
    "http://127.0.0.1:8000/v1/chat/completions",
    json={
        "model": "${model}",
        "messages": [{"role": "user",
                      "content": "What is the latest Python version?"}],
    },
    timeout=180,
)
print(r.headers["x-freshcheck-status"], r.headers["x-freshcheck-score"])
print(r.json()["freshcheck"]["claims"])`;
  $("apiResTxt").textContent=`HTTP 200 (illustrative response shape; values are placeholders)
x-freshcheck-status: possible-stale-suggestion | needs-review | no-stale-suggestion
x-freshcheck-score:  <heuristic score, not probability>

{
  "choices": [ { "message": { "content": "..." } } ],
  "freshcheck": {
    "score": <average heuristic score>,
    "fresh": <suggested count>, "stale": <suggested count>, "unclear": <count>,
    "claims": [ {
      "claim": "<candidate claim>",
      "verdict": "<fresh | stale | unclear>", "score": <heuristic score>,
      "correct_value": "<model suggestion; check the source>",
      "evidence_quote_matched": <true if the quote occurs in returned search text>,
      "source_url": "<returned source link>",
      "evidence": "<matched search-result text, not page verification>"
    } ]
  }
}

If review fails, the original chat response may still return with x-freshcheck-status: error and no FreshCheck metadata.`;
}
document.querySelectorAll("[data-copy]").forEach(b=>b.onclick=async()=>{
  const txt=$(b.dataset.copy+"Txt").textContent;
  try{await navigator.clipboard.writeText(txt);b.textContent="✔"}catch(e){}
  setTimeout(()=>b.textContent="📋",1500);
});
